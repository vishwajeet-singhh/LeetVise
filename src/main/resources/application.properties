spring.application.name=leetvise

# Your personal settings live in .env in the project folder (copy .env.example). It is git-ignored.
# Real environment variables with the same names win over .env.
spring.config.import=optional:file:./.env[.properties]

# Only reachable from this computer
server.address=127.0.0.1
server.port=${LEETVISE_PORT:8181}

# Leave LEETCODE_USERNAME empty to detect it from the session cookie or type it in the app
leetvise.username=${LEETCODE_USERNAME:}
leetvise.session=${LEETCODE_SESSION:}
leetvise.csrftoken=${LEETCODE_CSRF:}
# Relative paths resolve against the project folder (where you start the app)
leetvise.excel=${LEETVISE_EXCEL:data/leetvise.xlsx}
leetvise.open-browser=${LEETVISE_OPEN_BROWSER:true}

spring.web.resources.cache.period=0
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.recusant_byte.vishwajeet.leetvise=INFO

