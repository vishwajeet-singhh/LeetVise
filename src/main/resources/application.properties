spring.application.name=leetvise

# Only reachable from this computer
server.address=127.0.0.1
server.port=8181

# Your personal settings (LeetCode cookie etc.) live in config.properties next to pom.xml.
# It is git-ignored. Values there override the defaults below.
spring.config.import=optional:file:./config.properties

leetvise.username=recusant_byte
# Either set these env vars, or put leetvise.session / leetvise.csrftoken in config.properties
leetvise.session=${LEETCODE_SESSION:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..gMKxYZSPFPY3MoUVR1mdjHCAMAmOdUpYh-IqB2HXHQo}
leetvise.csrftoken=${LEETCODE_CSRF:x2LQQ0UbTWCHkeCYmB9Ra93DKT5PosgY}
# Relative paths resolve against the project folder (where you run mvn)
leetvise.excel=data/leetvise.xlsx
leetvise.open-browser=true

spring.web.resources.cache.period=0
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.leetvise=INFO
